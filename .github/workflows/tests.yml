# The whole suite on whatever pip resolves today, the way a new install gets it.
# The maintainer's own machine runs older pins (FastAPI 0.135 on 2026-11-01),
# and on FastAPI 0.162 app.routes hid included routers: the route-guard test
# checked 7 of 126 routes and passed. This run is what catches the next one.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1"   # Mondays: a new release upstream breaks us with no commit here
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[app,push,fcm,home_assistant,test]'
          python -m playwright install --with-deps chromium
      - name: Versions
        run: pip list | grep -iE '^(fastapi|starlette|uvicorn|httpx|playwright|pytest) '
      - name: Test
        run: python -m pytest -q
